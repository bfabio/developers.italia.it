on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NOKOGIRI_USE_SYSTEM_LIBRARIES: "true"
      ELASTICSEARCH_URL: "" # Disable searchyll for test.

    steps:
      - uses: actions/checkout@master

      - name: Use Node.js 14.x
        uses: actions/setup-node@master
        with:
          node-version: 14.x
      - name: Setup ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6'
          bundler-cache: true

      - run: sudo apt-get install -y
               wget gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2
               libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0
               libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0
               libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1
               libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1
               libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3
               lsb-release xdg-utils

      - run: npm ci
      - run: npm run test

      - run: make download-data
      - run: make jekyll-build
      - run: npm run lint

      - run: scripts/pa11y.sh
      - run: bundle exec htmlproofer ./_site --assume-extension --check-html --allow-hash-href --empty-alt-ignore --only-4xx --disable-external

      - uses: actions/upload-artifact@v3
        with:
          name: site
          path: _site/

  publish:
    needs: test

    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@master

      - uses: actions/download-artifact@v3
        with:
          name: site
          path: _site/

      - run: cp -r .well-known _site/

        # Make GitHub skip its Jekyll support and serve all the files
        # we built with our own Jekyll. This includes dotfiles.
      - run: touch _site/.nojekyll

      - run: npm ci
      - run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy -- --dotfiles -m "Automated deployment: ${GITHUB_SHA} [ci skip]"
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
